<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réservation — {{NOM}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Italiana&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<script src="../config.js"></script>
</head>
<body>

<nav class="nav" id="nav">
  <a href="../index.html" class="nav__logo">
    <span class="nav__brand-top" data-cfg="brand-prefix"></span>
    <span class="nav__brand" data-cfg="brand-name"></span>
  </a>
  <button class="nav__toggle" aria-label="Menu" id="navToggle">
    <span></span><span></span><span></span>
  </button>
  <ul class="nav__links" id="navLinks">
    <li><a href="../index.html">Accueil</a></li>
    <li><a href="galerie.html">Galerie</a></li>
    <li><a href="equipements.html">Équipements</a></li>
    <li><a href="avis.html">Avis</a></li>
    <li><a href="reservation.html" class="active">Réservation</a></li>
  </ul>
</nav>

<header class="page-header">
  <p class="page-header__eyebrow" data-cfg="reservation-eyebrow"></p>
  <h1 data-cfg="reservation-titre"></h1>
  <p data-cfg="reservation-soustitre"></p>
</header>

<section class="booking">
  <div class="booking__grid">

    <div class="booking__info">
      <h2 data-cfg="reservation-form-titre"></h2>
      <p data-cfg="reservation-form-intro"></p>

      <div class="booking__contacts">
        <a data-cfg-href="whatsapp" target="_blank" class="booking__contact">
          <div class="booking__contact-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884"/></svg>
          </div>
          <div class="booking__contact-info">
            <span>WhatsApp</span>
            <span data-cfg="tel-display"></span>
          </div>
        </a>

        <a data-cfg-href="tel" class="booking__contact">
          <div class="booking__contact-icon">☎</div>
          <div class="booking__contact-info">
            <span>Téléphone</span>
            <span data-cfg="tel-display"></span>
          </div>
        </a>

        <a data-cfg-href="email" class="booking__contact">
          <div class="booking__contact-icon">✉</div>
          <div class="booking__contact-info">
            <span>Email</span>
            <span data-cfg="email-display"></span>
          </div>
        </a>

        <div class="booking__contact">
          <div class="booking__contact-icon">📍</div>
          <div class="booking__contact-info">
            <span>Adresse</span>
            <span data-cfg="adresse-display"></span>
          </div>
        </div>
      </div>
    </div>

    <form class="booking__form" id="bookingForm">

      <div class="form__group">
        <label for="name">Nom complet</label>
        <input type="text" id="name" name="name" required placeholder="Votre nom et prénom">
      </div>

      <div class="form__row">
        <div class="form__group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="votre@email.com">
        </div>
        <div class="form__group">
          <label for="phone">Téléphone</label>
          <input type="tel" id="phone" name="phone" required placeholder="+590...">
        </div>
      </div>

      <div class="form__row">
        <div class="form__group">
          <label for="arrival">Date d'arrivée</label>
          <input type="date" id="arrival" name="arrival" required>
        </div>
        <div class="form__group">
          <label for="departure">Date de départ</label>
          <input type="date" id="departure" name="departure" required>
        </div>
      </div>

      <div class="form__group">
        <label for="guests">Nombre de voyageurs</label>
        <select id="guests" name="guests" required data-cfg="guests-select"></select>
      </div>

      <div class="form__group">
        <label for="message">Message (facultatif)</label>
        <textarea id="message" name="message" placeholder="Précisions, demandes particulières..."></textarea>
      </div>

      <button type="submit" class="form__submit">Envoyer la demande</button>

      <div class="form__success" id="formSuccess" data-cfg="reservation-form-success"></div>

    </form>

  </div>
</section>

<footer class="footer">
  <div class="footer__grid">
    <div>
      <h3 class="footer__brand" data-cfg="footer-brand"></h3>
      <p data-cfg="footer-tagline"></p>
    </div>
    <div>
      <h4>Contact</h4>
      <p><a data-cfg-href="email"><span data-cfg="email-display"></span></a><br>
      <a data-cfg-href="tel"><span data-cfg="tel-display"></span></a></p>
    </div>
    <div>
      <h4>Navigation</h4>
      <ul>
        <li><a href="../index.html">Accueil</a></li>
        <li><a href="galerie.html">Galerie</a></li>
        <li><a href="equipements.html">Équipements</a></li>
        <li><a href="avis.html">Avis</a></li>
      </ul>
    </div>
    <div>
      <h4>Suivez-nous</h4>
      <p>Retrouvez-nous sur Instagram et les plateformes de réservation.</p>
    </div>
  </div>
  <div class="footer__bottom">
    <p data-cfg="copyright"></p>
  </div>
</footer>

<a data-cfg-href="whatsapp" class="whatsapp-float" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893A11.821 11.821 0 0020.464 3.488"/></svg>
  <span>WhatsApp</span>
</a>

<script src="../js/render.js"></script>
<script src="../js/script.js"></script>
</body>
</html>
